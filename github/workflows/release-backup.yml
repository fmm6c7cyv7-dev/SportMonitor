name: Release Backup

on:
  push:
    tags:
      - "v*"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create backup zip
        run: |
          ZIP_NAME="SportMonitor_backup_${{ steps.version.outputs.version }}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x ".next/*"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportMonitor_backup_${{ steps.version.outputs.version }}
          path: SportMonitor_backup_${{ steps.version.outputs.version }}.zip
          