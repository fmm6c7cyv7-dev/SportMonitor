name: One-time Next.js security upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-next-security.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder_build_only_1234567890
      CRON_SECRET: placeholder-cron-secret
      INGEST_SECRET: placeholder-ingest-secret
      FAVORITE_AUDIT_SECRET: placeholder-favorite-audit-secret
      VAPID_PUBLIC_KEY: placeholder-vapid-public
      VAPID_PRIVATE_KEY: placeholder-vapid-private
      VAPID_SUBJECT: mailto:qa@example.com
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder-vapid-public
      TOP_RSS_URL: https://example.com/feed.xml
      TOP_MAX_AGE_HOURS: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js security release
        run: |
          npm install --save-exact next@16.3.5
          npm install --save-dev --save-exact eslint-config-next@16.3.5

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "security: upgrade Next.js to 16.3.5"
          git push origin HEAD:main
